[package]
name = "utsuri-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Utsuri's file actions without any UI: conversions, tools, archives, PDF"

[dependencies]
shared.workspace = true
anyhow.workspace = true
log.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif", "ico", "avif", "rayon"] }
webp = { version = "0.3", default-features = false }
color_quant = "1.1"
png = "0.17"
lopdf = "0.47"
krilla = "0.8"
pdf_oxide = { version = "0.3", default-features = false }
ttf-parser = "0.25"
kamadak-exif = "0.6"
img-parts = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
liblzma = "0.4"
bzip2 = "0.6"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
windows = { version = "0.62", features = [
    "Foundation", "Data_Pdf", "Storage", "Storage_Streams",
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole",
    "Win32_Graphics_Imaging", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Storage_FileSystem",
] }
windows-future = "0.3"
getrandom = "0.3"
ab_glyph = "0.2"
tiny-skia = "0.11"
