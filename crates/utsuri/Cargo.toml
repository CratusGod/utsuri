[package]
name = "utsuri"
version = "2.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shift+drag a file to get a radial menu of conversions and tools (Windows)"

[dependencies]
install = { path = "../install" }
shared.workspace = true
utsuri-engine = { path = "../utsuri-engine" }
anyhow.workspace = true
log.workspace = true
rune.workspace = true
rune-kit.workspace = true
wgpu.workspace = true
raw-window-handle.workspace = true
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = { version = "3", default-features = false, features = ["image-data"] }
rfd = "0.18"
winreg = "0.56"
windows-core = "0.62"
kamadak-exif = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_System_Pipes",
    "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_Kernel",
] }

[build-dependencies]
embed-resource = "3"
