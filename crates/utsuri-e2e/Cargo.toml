[package]
name = "utsuri-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Drives the real Utsuri with real mouse drags from File Explorer and checks every result"

[dependencies]
utsuri-engine = { path = "../utsuri-engine" }
anyhow.workspace = true
image.workspace = true
serde_json = "1"
arboard = { version = "3", default-features = false, features = ["image-data"] }

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25"
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Gdi",
] }
